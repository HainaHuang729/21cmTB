<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPL / PL · Corner 图设计</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#202833;font:15px system-ui,-apple-system,sans-serif}header{max-width:1400px;margin:auto;padding:42px 28px 25px}header small{letter-spacing:3px;color:#617180}h1{font-size:30px;font-weight:550;margin:12px 0}header p{color:#647080;line-height:1.7}nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}button{font:inherit;border:1px solid #ccd1d7;border-radius:6px;padding:10px 16px;background:white;cursor:pointer}button[aria-pressed=true]{background:#24364b;color:white;border-color:#24364b}main{max-width:1400px;margin:auto;padding:0 28px 50px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{--paper:white;--ink:#24364b;--dim:#73808c;--grid:#e7ebef;--bpl:#ba4a37;--pl:#2676b5;background:var(--paper);color:var(--ink);padding:24px;border-radius:10px;border:1px solid #dde1e5;box-shadow:0 8px 26px #18283806;min-width:0}.warm{--paper:#f7f3e9;--ink:#302f2a;--dim:#827a6c;--grid:#e3ddcf;--bpl:#b5533d;--pl:#347a85}.dark{--paper:#152130;--ink:#e6eef6;--dim:#9aaabd;--grid:#304152;--bpl:#ffad7c;--pl:#70cbd8;border-color:#304152}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--dim)}h2{font-size:20px;font-weight:550;margin:9px 0 7px}.meta{font-size:12px;color:var(--dim);line-height:1.8}.legend{display:flex;gap:20px;font-size:12px;margin:20px 0 2px}.legend span{display:flex;align-items:center;gap:7px}.legend i{width:23px;border-top:2px solid var(--bpl)}.legend .pl{border-color:var(--pl);border-top-style:dashed}svg{width:100%;height:auto;overflow:visible;margin-top:8px}footer{border-top:1px solid var(--grid);margin-top:12px;padding-top:16px;color:var(--dim);font-size:11px;line-height:1.8}.description{margin:18px 0 0;color:var(--dim);font-size:13px;line-height:1.8}main.focus{grid-template-columns:minmax(0,850px);justify-content:center}main.focus .card{padding:32px}a{color:inherit}.notice{display:inline-block;border:1px solid #c9cfd7;padding:5px 9px;border-radius:4px;font-size:12px}button:focus-visible{outline:3px solid #4c9ee6;outline-offset:3px}@media(max-width:1100px){main{grid-template-columns:1fr;max-width:850px}}@media(max-width:500px){header{padding:26px 16px}main{padding:0 12px 30px}.card{padding:14px}h1{font-size:25px}}
.table-wrap{overflow-x:auto;margin:10px 0 22px}table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}caption{text-align:left;font-size:13px;color:var(--dim);padding:12px 0}th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--grid)}th:first-child{text-align:left}thead th{font-size:11px;color:var(--dim)}.focus .card{max-width:850px}</style><header><small>INFERENCE / VISUAL STUDIES</small><h1>BPL 与 PL：白底 Corner 图</h1><p>每个模型一张图，两种颜色区分 BPL 与共享 PL 基准。PL 使用虚线，便于黑白打印。<br><span class="notice">设计预览 · 曲线和数值均为示意，并非 MCMC 结果</span></p></header><main id="gallery" class="focus"></main>
<script>
const designs=[{name:'论文白底',className:'',subtitle:'PUBLICATION / CLEAN',note:'白底、细轴线和少量刻度。适合文章插图、PDF 和打印；实线与虚线同时区分两种模型。'},{name:'网页暖色',className:'warm',subtitle:'ATLAS / WARM PAPER',note:'暖纸色背景、砖红与青蓝线条。适合当前网页，图下保留链长和诊断说明。'},{name:'深色展示',className:'dark',subtitle:'PRESENTATION / NIGHT',note:'深蓝底、杏色与青色高对比线条。适合屏幕浏览和汇报展示，减少背景网格。'}];
const names=['log₁₀ f★,10','t★','α★','log₁₀(Mturn/M☉)'];
const spans=[[ -2.214285714, -0.785714286],[.071428571,.928571429],[.071428571,.928571429],[7.571428571,10.428571429]];
const value=(i,u)=>spans[i][0]+u*(spans[i][1]-spans[i][0]);
const fmt=v=>v.toFixed(2).replace('-', '−');
const ticks=[['−2.0','−1.5','−1.0'],['0.2','0.5','0.8'],['0.2','0.5','0.8'],['8.0','9.0','10.0']];
function corner(){let s='<svg viewBox="0 0 650 770" role="img" aria-label="四参数 BPL 和 PL 分布示意图，非计算结果"><title>BPL / PL corner 图设计示意</title>';const x0=67,y0=68,w=122,gap=18;const text=(x,y,t,extra='')=>`<text x="${x}" y="${y}" fill="var(--dim)" font-size="10" text-anchor="middle" ${extra}>${t}</text>`;
for(let i=0;i<4;i++)for(let j=0;j<=i;j++){let x=x0+j*(w+gap),y=y0+i*(w+54);if(i===j){for(let k=0;k<2;k++){const mu=k?.58:.43,sigma=k?.185:.135,med=value(i,mu),err=(spans[i][1]-spans[i][0])*sigma*.99446,col=k?'var(--pl)':'var(--bpl)';s+=`<text x="${x+w/2}" y="${y-33+k*18}" fill="${col}" font-size="11" text-anchor="middle">${k?'PL':'BPL'}: ${fmt(med)}<tspan baseline-shift="super" font-size="8">+${err.toFixed(2)}</tspan><tspan baseline-shift="sub" font-size="8">−${err.toFixed(2)}</tspan></text>`;}}s+=`<defs><clipPath id="c${i}${j}"><rect x="${x}" y="${y}" width="${w}" height="${w}"/></clipPath></defs>`;s+=`<path d="M${x},${y}v${w}h${w}" fill="none" stroke="var(--dim)" stroke-width=".7"/>`;s+=`<g clip-path="url(#c${i}${j})">`;
for(let k=0;k<2;k++){const color=k?'var(--pl)':'var(--bpl)',dash=k?'stroke-dasharray="5 3"':'';if(i===j){const mu0=k?.58:.43,sigma0=k?.185:.135;for(const [u,kind] of [[mu0-sigma0*.99446,'bound'],[mu0,'median'],[mu0+sigma0*.99446,'bound']]){s+=`<path d="M${x+w*u},${y+5}v${w-5}" stroke="${color}" stroke-width="${kind==='median'?1.1:.8}" opacity="${kind==='median'?.65:.4}" stroke-dasharray="${kind==='median'?(k?'5 3':'none'):'2 3'}"/>`;}let d='';for(let n=0;n<=100;n++){let u=n/100,mu=.48+(k?.10:-.05),sigma=k?.185:.135,v=Math.exp(-.5*((u-mu)/sigma)**2)/(sigma*7.5);d+=(n?'L':'M')+(x+w*u).toFixed(2)+','+(y+w-5-v*(w-17)).toFixed(2)}s+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2" ${dash}/>`}else{let cx=x+w*(k?.58:.44),cy=y+w*(k?.44:.56),angle=((i+j)%2? -32:30);for(let scale of [1,.65]){s+=`<ellipse cx="${cx}" cy="${cy}" rx="${w*(k?.34:.28)*scale}" ry="${w*(k?.19:.14)*scale}" transform="rotate(${angle},${cx},${cy})" fill="${scale===1?color:'none'}" fill-opacity=".05" stroke="${color}" stroke-width="1.7" ${dash}/>`}}}s+='</g>';
for(let k=0;k<3;k++){let xx=x+w*(.15+.35*k);s+=`<path d="M${xx},${y+w}v4" stroke="var(--dim)"/>`;if(i===3)s+=text(xx,y+w+16,ticks[j][k]);if(j===0&&i>0){let yy=y+w*(.85-.35*k);s+=text(x-20,yy+3,ticks[i][k])}}
if(i===3)s+=text(x+w/2,y+w+40,names[j],'font-weight="600"');if(j===0&&i>0)s+=text(13,y+w/2,names[i],`transform="rotate(-90,13,${y+w/2})" font-weight="600"`)}s+=text(445,92,'BPL / PL','font-size="17" font-weight="600"');s+=text(445,116,'同一参数坐标 · 独立归一化');s+=text(445,137,'轮廓为示意 · 非真实区间');s+=text(445,163,'标注：中位数及 16%–84% 区间');s+=text(445,184,'中线：中位数 · 点线：上下限');return s+'</svg>'}
function bestTable(){return `<div class="table-wrap"><table><caption>最佳拟合值单独列示 · 示意数值</caption><thead><tr><th>参数</th><th>BPL 最佳值</th><th>PL 最佳值</th></tr></thead><tbody>${names.map((n,i)=>`<tr><th>${n}</th><td style="color:var(--bpl)">${fmt(value(i,.45))}</td><td style="color:var(--pl)">${fmt(value(i,.56))}</td></tr>`).join('')}</tbody></table></div>`;}
const gallery=document.querySelector('#gallery');designs.slice(0,1).forEach((d,i)=>{const a=document.createElement('article');a.className='card '+d.className;a.dataset.id=i;a.innerHTML=`<div class="eyebrow">0${i+1} / ${d.subtitle}</div><h2>${d.name}</h2><div class="meta">LF only · 四参数<br>BPL：kₚ = 10 h Mpc⁻¹ · mₛ = 2.5</div><div class="legend"><span><i></i>BPL</span><span><i class="pl"></i>PL 基准</span></div>${corner().replaceAll(/id="c(\d\d)"/g,`id="v${i}c$1"`).replaceAll(/url\(#c(\d\d)\)/g,`url(#v${i}c$1)`)}${bestTable()}<footer>图上数字：中位数，上下误差由第 16 / 84 百分位数计算。最佳拟合值另列，正式结果取链中 LF 似然最高的同一个样本。<br>正式图将显示：BPL / PL 各自的采样步数与收敛诊断状态。<br>示意图仅用于选样式，不代表最佳拟合、后验区间或参数约束。</footer><p class="description">${d.note}</p>`;gallery.appendChild(a)});
document.querySelectorAll('button[data-view]').forEach(b=>b.addEventListener('click',()=>{const view=b.dataset.view;document.querySelectorAll('button[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));gallery.classList.toggle('focus',view!=='all');gallery.querySelectorAll('.card').forEach(x=>x.hidden=view!=='all'&&x.dataset.id!==view)}));
</script></html>
