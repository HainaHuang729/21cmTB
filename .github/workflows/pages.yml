name: Deploy static 21cmFAST atlas to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate static site
        run: |
          node --check app.js
          python -c "import json, pathlib; root = pathlib.Path('web_data/runs'); files = list(root.glob('*.json')); payloads = [json.loads(path.read_text()) for path in files]; assert len(payloads) == 57; assert all(item['schema_version'] == 4 and 'ionized_fraction_i16_le_base64' in item['slices'] for item in payloads)"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
