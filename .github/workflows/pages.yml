name: Deploy static 21cmFAST atlas to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate static site
        run: |
          node --check app.js
          node --check i18n.js
          node tests/test_i18n.cjs
          python - <<'PY'
          import json
          import pathlib
          import zlib

          root = pathlib.Path("web_data/runs")
          index = json.loads(pathlib.Path("web_data/index.json").read_text())
          app = pathlib.Path("app.js").read_text()
          html = pathlib.Path("index.html").read_text()
          css = pathlib.Path("styles.css").read_text()
          files = sorted(root.glob("*.json"))
          binaries = sorted(root.glob("*.slices.bin"))
          pl_root = pathlib.Path("web_data/pl")
          pl_files = sorted(pl_root.glob("pl_*.json"))
          pl_binaries = sorted(pl_root.glob("pl_*.slices.bin"))
          expected_unavailable = {"run_4600848a9a8c", "run_5f2309678207"}
          assert 'DATA_VERSION = "hii256-v18"' in app
          assert 'UI_VERSION = "hii256-v19"' in app
          assert "(value + 150) / 180" in app
          assert "eorStops" in app and "viridisStops" in app
          assert html.count("hii256-v19") == 3
          assert pathlib.Path("i18n.js").is_file()
          assert 'data-language="en"' in html and 'data-language="zh"' in html
          assert "mission-hero" in html and "system-header" in html
          assert "--orange: #df5a2e" in css
          assert "prefers-reduced-motion" in css
          assert "上一模型" not in html
          assert "Matched PL" in html
          assert "lf-main-card" in html and 'id="lf-chart"' in html
          assert html.count('data-field="') == 5
          assert html.count('data-pl-field="') == 5
          assert "−150 mK" in html and "+30 mK" in html
          assert index["result_schema_version"] == 7
          pl_schema = index["pl_result_schema_version"]
          assert pl_schema == 2
          assert index["n_exact_runs"] == 55 and index["n_design_points"] == 57
          assert index["n_unique_pl_references"] == 32
          assert sum(
              len(points)
              for points in index["lf_observations"]["by_display_redshift"].values()
          ) == 44
          assert set(index["unavailable_run_ids"]) == expected_unavailable
          assert len(files) == len(binaries) == 55
          assert len(pl_files) == 32
          assert len(pl_binaries) == 32
          pl_ids = set()
          for path in pl_files:
              payload = json.loads(path.read_text())
              assert payload["schema_version"] == pl_schema
              assert payload["model"]["POWER_SPECTRUM"] == 0
              assert payload["model"]["POWER_INDEX"] == 0.968
              assert payload["luminosity_function"]["redshift"] == [6.0, 7.0, 8.0, 10.0]
              if pl_schema == 2:
                  assert 0 < payload["ionization_history"]["tau_e"] < 1
                  assert len(payload["ionization_history"]["redshift"]) == 32
                  slices = payload["slices"]
                  assert slices["shape"] == [32, 256, 256]
                  assert len(slices["redshift"]) == 32
                  packed = (pl_root / slices["binary_file"]).read_bytes()
                  for descriptor in slices["binary_fields"].values():
                      start = descriptor["offset"]
                      stop = start + descriptor["compressed_bytes"]
                      assert len(zlib.decompress(packed[start:stop])) == descriptor["uncompressed_bytes"]
              pl_ids.add(payload["pl_id"])
          for path in files:
              payload = json.loads(path.read_text())
              slices = payload["slices"]
              assert payload["schema_version"] == 7
              assert slices["shape"] == [32, 256, 256]
              assert len(slices["redshift"]) == 32
              assert payload["luminosity_function"]["redshift"] == [6.0, 7.0, 8.0, 10.0]
              assert len(payload["luminosity_function"]["curves"]) == 4
              assert 0 < payload["ionization_history"]["tau_e"] < 1
              assert len(payload["ionization_history"]["redshift"]) == 32
              assert payload["pl_reference"]["pl_id"] in pl_ids
              assert pathlib.Path(payload["pl_reference"]["file"]).is_file()
              pl = json.loads(pathlib.Path(payload["pl_reference"]["file"]).read_text())
              assert all(
                  abs(a - b) <= 1.0e-4
                  for a, b in zip(slices["redshift"], pl["slices"]["redshift"])
              )
              assert all(
                  payload["parameters"][name] == value
                  for name, value in pl["astro_parameters"].items()
              )
              packed = (root / slices["binary_file"]).read_bytes()
              for descriptor in slices["binary_fields"].values():
                  start = descriptor["offset"]
                  stop = start + descriptor["compressed_bytes"]
                  assert len(zlib.decompress(packed[start:stop])) == descriptor["uncompressed_bytes"]
          assert sum(path.stat().st_size for path in binaries + pl_binaries) < 1_500_000_000
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
