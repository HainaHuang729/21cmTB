name: Deploy static 21cmFAST atlas to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate static site
        run: |
          node --check app.js
          python -c "import json, pathlib; root = pathlib.Path('web_data/runs'); files = list(root.glob('*.json')); payloads = [json.loads(path.read_text()) for path in files]; required = {'ionized_fraction_i16_le_base64', 'spin_temperature_log10_i16_le_base64', 'kinetic_temperature_log10_i16_le_base64'}; assert len(payloads) == 57; assert all(item['schema_version'] == 6 and required <= item['slices'].keys() and item['slices']['shape'] == [32, 64, 64] and item['luminosity_function']['redshift'] == [6.0, 7.0, 8.0, 10.0] and len(item['luminosity_function']['curves']) == 4 for item in payloads)"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
